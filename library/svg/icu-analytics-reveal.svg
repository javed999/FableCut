<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
     font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica Neue, Arial, sans-serif">
  <style>
    .dot { transform-box: fill-box; transform-origin: center;
           animation: live 2.2s ease-in-out infinite; }
    @keyframes live { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }
    .fade { animation: fade .35s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    /* One slot per running total: off, on for its slot, off again. The final
       value uses .totlast so it holds to the end of the clip instead. */
    .tot { opacity: 0; animation-name: slot; animation-fill-mode: both; animation-timing-function: linear; }
    @keyframes slot { 0% { opacity: 0; } 0.5% { opacity: 1; } 99.5% { opacity: 1; } 100% { opacity: 0; } }
    .totlast { animation: totlast .4s ease-out both; }
    @keyframes totlast { from { opacity: 0; } 2% { opacity: 1; } to { opacity: 1; } }
    .row { transform-box: fill-box; transform-origin: center;
           animation: rowIn .45s cubic-bezier(.2,.9,.25,1) both; }
    @keyframes rowIn { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left center;
           animation: barIn .6s cubic-bezier(.2,.9,.25,1) both; }
    @keyframes barIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .foot { animation: footIn .5s ease-out both; }
    @keyframes footIn { from { opacity: 0; transform: translateY(10px); } to { opacity: .9; transform: none; } }
  </style>
