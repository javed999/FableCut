<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
     font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica Neue, Arial, sans-serif">
  <!-- The 10.2s beat: the screen wakes. Transparent ground, so it composites over
       footage when there is any and reads on black when there is not. Same panel
       geometry as the cold / zero / reveal screens, so the three read as one screen. -->
  <defs>
    <radialGradient id="bloom" cx="50%" cy="34%" r="58%">
      <stop offset="0%"   stop-color="#eafff2" stop-opacity="1"/>
      <stop offset="42%"  stop-color="#4ade80" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#eafff2" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .flash { animation: flash .34s cubic-bezier(.1,.8,.3,1) both; }
    @keyframes flash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }

    .sweep { animation: sweep .42s cubic-bezier(.3,.7,.2,1) both; }
    @keyframes sweep { 0% { transform: translateY(-220px); opacity: 0; }
                       18% { opacity: 1; }
                       100% { transform: translateY(1560px); opacity: 0; } }

    .panel { animation: panelIn .38s cubic-bezier(.2,.9,.25,1) both; }
    @keyframes panelIn { from { opacity: 0; transform: scale(.985); }
                         to   { opacity: .94; transform: none; } }

    /* Row placeholders pulse where the seven countries are about to land. */
    .ph { animation: ph .75s ease-in-out infinite; }
    @keyframes ph { 0%,100% { opacity: .16; } 50% { opacity: .5; } }

    .dot { animation: live 1.1s ease-in-out infinite; }
    @keyframes live { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    .cue { animation: cueIn .4s ease-out both; }
    @keyframes cueIn { from { opacity: 0; } to { opacity: .85; } }
  </style>

  <g class="panel" style="--d:0.18s" transform-origin="540 800">
    <rect x="60" y="150" width="960" height="1300" rx="44" fill="#0d1117" stroke="#1c2128" stroke-width="2"/>
    <circle class="dot" style="--d:0.4s" cx="132" cy="238" r="9" fill="#4ade80"/>
    <text x="158" y="252" font-size="40" font-weight="700" fill="#e6edf3">icudecodedd.com</text>
    <text x="130" y="312" font-size="29" font-weight="600" fill="#7d8590" letter-spacing="5">PAGEVIEWS &#183; LAST 7 DAYS</text>
    <line x1="130" y1="356" x2="950" y2="356" stroke="#21262d" stroke-width="2"/>
    <text class="cue" style="--d:0.55s" x="540" y="560" font-size="120" font-weight="800" fill="#21262d" text-anchor="middle">&#8212;&#8212;&#8212;</text>
    <g fill="#4ade80">
      <rect class="ph" style="--d:0.60s" x="194" y="798"  width="748" height="7" rx="3.5"/>
      <rect class="ph" style="--d:0.68s" x="194" y="890"  width="620" height="7" rx="3.5"/>
      <rect class="ph" style="--d:0.76s" x="194" y="982"  width="430" height="7" rx="3.5"/>
      <rect class="ph" style="--d:0.84s" x="194" y="1074" width="300" height="7" rx="3.5"/>
      <rect class="ph" style="--d:0.92s" x="194" y="1166" width="210" height="7" rx="3.5"/>
      <rect class="ph" style="--d:1.00s" x="194" y="1258" width="150" height="7" rx="3.5"/>
      <rect class="ph" style="--d:1.08s" x="194" y="1350" width="110" height="7" rx="3.5"/>
    </g>
  </g>

  <ellipse class="flash" style="--d:0s" cx="540" cy="700" rx="760" ry="620" fill="url(#bloom)"/>
  <rect class="sweep" style="--d:0.06s" x="60" y="150" width="960" height="150" fill="url(#sweep)"/>
</svg>
