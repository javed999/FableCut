<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
     font-family="Segoe UI, system-ui, -apple-system, Roboto, Helvetica Neue, Arial, sans-serif">
  <style>
    .dot { transform-box: fill-box; transform-origin: center;
           animation: live 2.2s ease-in-out infinite; }
    @keyframes live { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }
    .wk { opacity: 0; animation-name: slot; animation-fill-mode: both; animation-timing-function: linear; }
    @keyframes slot { 0% { opacity: 0; } 2% { opacity: 1; } 98% { opacity: 1; } 100% { opacity: 0; } }
    .wklast { animation: wklast .3s ease-out both; }
    @keyframes wklast { from { opacity: 0; } to { opacity: 1; } }
    .caret { animation: blink 1s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>
  
  <rect width="1080" height="1920" fill="#07090d"/>
